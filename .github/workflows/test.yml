name: test

on:
  push:
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "reuse[charset-normalizer]==6.2.0"
      - run: reuse lint
      - run: PYTHONPATH=src python -m unittest discover -s tests
      - run: python -m compileall -q src examples tests
