[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "eventide"
version = "0.1.0"
description = "A body-state, dream-link, and settlement engine for AI companions."
readme = "README.md"
requires-python = ">=3.9"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE", "LICENSES/*.txt"]
authors = [
  { name = "Chuli" }
]
keywords = ["ai-companion", "body-state", "physiology", "dreams", "settlement", "prompt-engineering"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

[project.urls]
Homepage = "https://github.com/chuli1122/Eventide"
Repository = "https://github.com/chuli1122/Eventide"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
eventide = ["*.license"]
